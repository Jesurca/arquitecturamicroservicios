# Plataforma Académica: 7 microservicios + API Gateway + RabbitMQ (arquitectura de docs/Taller arquitectura.png)
# Uso: docker compose up -d --build   →   http://localhost:8080
#
# Cada contenedor del diagrama tiene 6 bloques. Así se implementan aquí:
#   NET    → redes a las que se une el contenedor (y su alias DNS)
#   ISO    → aislamiento: usuario no-root, FS de solo lectura, sin capabilities, límites de CPU/RAM/PIDs
#   Config → env_file: config/common.env + config/<servicio>.env
#   Bridge → todas las redes usan el driver bridge, con subred propia
#   Data   → volumen con nombre para la base de datos propia (Database per Service)
#   Disk   → /tmp en tmpfs con tamaño fijo + logs rotados (el contenedor no puede llenar el disco del host)
#
# Zonas de red (cuadros punteados del diagrama):
#   edge-net    → Cliente → API Gateway (única red con puertos publicados)
#   saga-net    → "Aggregator y Saga Pattern": enrollment, student, course, teacher   (internal)
#   domain-net  → "Servicio de Dominio y Mensajería Branch Pattern": auth, payment, notification, rabbitmq (internal)
#   rabbitmq está en saga-net y domain-net: los servicios de una zona NO pueden llamarse por HTTP con los
#   de la otra; solo se comunican por eventos a través del bus (academic.events) o pasando por el gateway.

x-iso: &iso # [ISO] + [Disk], común a todos los microservicios
  restart: unless-stopped
  init: true
  read_only: true
  user: node
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 256m
  cpus: 0.50
  pids_limit: 100
  tmpfs: ["/tmp:size=16m,mode=1777"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 10s

x-env: &env
  JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion}

x-needs-bus: &needs-bus
  rabbitmq: { condition: service_healthy }

services:
  # ───────────────────────── Bus de eventos ─────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pa-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    init: true                        # tini como PID 1: un crash del broker hace salir al contenedor y Docker lo revive
    labels: { pa.zone: domain, pa.role: broker }
    ports: ["15672:15672"]            # consola web (guest / guest)
    networks:
      domain-net: { aliases: [rabbitmq] }
      saga-net: { aliases: [rabbitmq] }   # el broker es el único puente entre zonas (Comandos/Eventos Saga)
      edge-net: {}                    # solo para poder publicar el puerto de la consola
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ───────────── Zona: Aggregator y Saga Pattern (saga-net) ─────────────
  enrollment-service:
    <<: *iso
    build: { context: ., args: { SERVICE: services/enrollment/index.js } }
    image: plataforma-academica/enrollment-service
    container_name: pa-enrollment-service
    labels: { pa.zone: saga, pa.role: orquestador-saga }
    env_file: [config/common.env, config/enrollment-service.env]
    environment: *env
    networks: [saga-net]
    volumes: ["enrollment-db:/data"]
    healthcheck: { <<: *health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/health"] }
    depends_on: *needs-bus

  student-service:
    <<: *iso
    build: { context: ., args: { SERVICE: services/student/index.js } }
    image: plataforma-academica/student-service
    container_name: pa-student-service
    labels: { pa.zone: saga, pa.role: dominio }
    env_file: [config/common.env, config/student-service.env]
    environment: *env
    networks: [saga-net]
    volumes: ["student-db:/data"]
    healthcheck: { <<: *health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"] }
    depends_on: *needs-bus

  course-service:
    <<: *iso
    build: { context: ., args: { SERVICE: services/course/index.js } }
    image: plataforma-academica/course-service
    container_name: pa-course-service
    labels: { pa.zone: saga, pa.role: dominio }
    env_file: [config/common.env, config/course-service.env]
    environment: *env
    networks: [saga-net]
    volumes: ["course-db:/data"]
    healthcheck: { <<: *health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"] }
    depends_on: *needs-bus

  teacher-service:
    <<: *iso
    build: { context: ., args: { SERVICE: services/teacher/index.js } }
    image: plataforma-academica/teacher-service
    container_name: pa-teacher-service
    labels: { pa.zone: saga, pa.role: dominio }
    env_file: [config/common.env, config/teacher-service.env]
    environment: *env
    networks: [saga-net]
    volumes: ["teacher-db:/data"]
    healthcheck: { <<: *health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"] }
    depends_on: *needs-bus

  # ───── Zona: Servicio de Dominio y Mensajería Branch Pattern (domain-net) ─────
  auth-service:
    <<: *iso
    build: { context: ., args: { SERVICE: services/auth/index.js } }
    image: plataforma-academica/auth-service
    container_name: pa-auth-service
    labels: { pa.zone: domain, pa.role: branch }
    env_file: [config/common.env, config/auth-service.env]
    environment: *env
    networks: [domain-net]
    volumes: ["auth-db:/data"]
    healthcheck: { <<: *health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"] }
    depends_on: *needs-bus

  payment-service:
    <<: *iso
    build: { context: ., args: { SERVICE: services/payment/index.js } }
    image: plataforma-academica/payment-service
    container_name: pa-payment-service
    labels: { pa.zone: domain, pa.role: branch }
    env_file: [config/common.env, config/payment-service.env]
    environment: *env
    networks: [domain-net]
    volumes: ["payment-db:/data"]
    healthcheck: { <<: *health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3006/health"] }
    depends_on: *needs-bus

  notification-service:
    <<: *iso
    build: { context: ., args: { SERVICE: services/notification/index.js } }
    image: plataforma-academica/notification-service
    container_name: pa-notification-service
    labels: { pa.zone: domain, pa.role: async }
    env_file: [config/common.env, config/notification-service.env]
    environment: *env
    networks: [domain-net]
    volumes: ["notification-db:/data"]
    healthcheck: { <<: *health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3007/health"] }
    depends_on: *needs-bus

  # ───────────────────────── Proxy Pattern ─────────────────────────
  api-gateway:
    <<: *iso
    build: { context: ., args: { SERVICE: gateway/index.js } }
    image: plataforma-academica/api-gateway
    container_name: pa-api-gateway
    labels: { pa.zone: edge, pa.role: proxy }
    env_file: [config/common.env, config/api-gateway.env]
    environment: *env
    ports: ["8080:8080"]
    networks: [edge-net, saga-net, domain-net]   # el gateway es el único que ve las dos zonas
    healthcheck: { <<: *health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"] }
    depends_on:
      auth-service: { condition: service_healthy }
      student-service: { condition: service_healthy }
      teacher-service: { condition: service_healthy }
      course-service: { condition: service_healthy }
      enrollment-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }

# [NET] + [Bridge]
networks:
  edge-net:
    name: pa-edge-net
    driver: bridge
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
  saga-net:
    name: pa-saga-net
    driver: bridge
    internal: true
    ipam: { config: [{ subnet: 172.30.1.0/24 }] }
  domain-net:
    name: pa-domain-net
    driver: bridge
    internal: true
    ipam: { config: [{ subnet: 172.30.2.0/24 }] }

# [Data]: una base de datos por servicio
volumes:
  auth-db:
  student-db:
  teacher-db:
  course-db:
  enrollment-db:
  payment-db:
  notification-db:
  rabbitmq-data:
