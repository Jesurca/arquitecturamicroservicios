<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plataforma Académica</title>
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#16213e;--muted:#5d6783;--line:#d9deea;--side:#16213e;--accent:#3b4cca;--ok:#1f8a5b;--warn:#a86b00;--bad:#c0392b;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 var(--sans);color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h2{font-size:26px;margin-bottom:4px}h3{font-size:18px;margin:24px 0 10px}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:6px 12px}
button.ghost{background:transparent;color:var(--accent)}button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid #9aa5ff;outline-offset:2px}
input,select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;width:100%}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .intro{background:var(--side);color:#fff;padding:64px 56px;display:flex;flex-direction:column;justify-content:center}
.login .intro h1{font-size:44px;line-height:1.1;max-width:14ch}
.login .intro p{color:#b8c1dd;max-width:42ch;margin-top:18px}
.login .form{padding:64px 56px;display:flex;flex-direction:column;justify-content:center;max-width:460px}
.login .form>div{margin-bottom:14px}
.demo{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.demo button{margin:0 6px 6px 0;font-size:13px;padding:4px 10px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--side);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
nav .brand{font-family:var(--serif);font-size:19px;padding:0 10px 4px}
nav .who{font-size:13px;color:#aeb8d6;padding:0 10px 18px}
nav button.item{display:block;width:100%;text-align:left;background:transparent;border:0;color:#d4dbf0;padding:9px 10px;border-radius:6px;margin-bottom:2px}
nav button.item[aria-current=page]{background:#26335c;color:#fff}
nav .spacer{flex:1}
main{padding:32px 40px;max-width:1100px;width:100%}
.sub{color:var(--muted);margin:0 0 20px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;background:#f7f8fb}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e6e9f4;color:var(--ink)}
.pill.ok{background:#dcf2e8;color:var(--ok)}.pill.warn{background:#fbefd5;color:var(--warn)}.pill.bad{background:#f8dedb;color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stat b{display:block;font-family:var(--serif);font-size:28px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;margin-bottom:12px}
.note{padding:10px 12px;border-radius:6px;background:#fbefd5;color:#6b4500;margin-bottom:14px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:8px}
.unread{border-left:3px solid var(--accent)}
.notice{padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.notice small{color:var(--muted)}
#toast{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:20}
#toast div{background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;max-width:360px}
#toast div.err{background:var(--bad)}
dialog{border:1px solid var(--line);border-radius:10px;padding:22px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(22,33,62,.45)}
@media(max-width:820px){.login{grid-template-columns:1fr}.login .intro{padding:36px 28px}.login .form{padding:28px}.shell{grid-template-columns:1fr}nav{position:static;height:auto}main{padding:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<dialog id="payDlg"></dialog>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cop = (n) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(n);
const fdate = (d) => d ? new Date(d).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
let token = localStorage.getItem('token'), user = JSON.parse(localStorage.getItem('user') || 'null'), current = null;

async function api(path, { method = 'GET', body } = {}) {
  const r = await fetch('/api' + path, { method, headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { logout(); throw new Error(d.error); }
  if (!r.ok) throw new Error(d.error || 'Error ' + r.status);
  return d;
}
function toast(msg, err) { const d = document.createElement('div'); d.textContent = msg; if (err) d.className = 'err'; $('#toast').append(d); setTimeout(() => d.remove(), 4500); }
const run = async (fn) => { try { await fn(); } catch (e) { toast(e.message, true); } };
const STATUS = { ABIERTO: 'ok', CERRADO: 'bad', CONFIRMADA: 'ok', PENDIENTE_PAGO: 'warn', CREADA: 'warn', CANCELADA: 'bad', RECHAZADA: 'bad', PAGADO: 'ok', PENDIENTE: 'warn', FALLIDO: 'bad', EXPIRADO: 'bad', ANULADO: '', ACTIVO: 'ok', UP: 'ok', DOWN: 'bad' };
const pill = (s) => `<span class="pill ${STATUS[s] ?? ''}">${esc(s.replace('_', ' ').toLowerCase())}</span>`;
const table = (heads, rows, empty) => rows.length ? `<div class="tablewrap"><table><thead><tr>${heads.map((h) => `<th${h.startsWith('#') ? ' class="num"' : ''}>${esc(h.replace('#', ''))}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<div class="empty">${esc(empty)}</div>`;

/* ---------- Login ---------- */
function renderLogin() {
  $('#app').innerHTML = `<div class="login"><section class="intro"><h1>Plataforma Académica</h1><p>Matrículas, pagos, cursos y notas en un solo lugar. Ingresa con tu correo institucional.</p></section>
  <section class="form"><h2>Iniciar sesión</h2><p class="sub">Usa una cuenta de demostración o la tuya.</p>
  <div><label for="em">Correo</label><input id="em" type="email" autocomplete="username"></div>
  <div><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button id="go">Entrar</button>
  <div class="demo"><label>Cuentas de demostración</label>
   <button class="ghost" data-u="estudiante1@uni.edu" data-p="estudiante123">Ana (estudiante)</button>
   <button class="ghost" data-u="estudiante2@uni.edu" data-p="estudiante123">Luis (estudiante)</button>
   <button class="ghost" data-u="docente2@uni.edu" data-p="docente123">Carlos (docente)</button>
   <button class="ghost" data-u="admin@uni.edu" data-p="admin123">Administración</button></div></section></div>`;
  const go = () => run(async () => {
    const d = await api('/auth/login', { method: 'POST', body: { email: $('#em').value.trim(), password: $('#pw').value } });
    token = d.token; user = d.user; localStorage.setItem('token', token); localStorage.setItem('user', JSON.stringify(user)); boot();
  });
  $('#go').onclick = go; $('#pw').onkeydown = (e) => e.key === 'Enter' && go();
  document.querySelectorAll('.demo button').forEach((b) => b.onclick = () => { $('#em').value = b.dataset.u; $('#pw').value = b.dataset.p; go(); });
}
function logout() { token = null; user = null; localStorage.clear(); renderLogin(); }

/* ---------- Shell ---------- */
const MENUS = {
  estudiante: [['resumen', 'Resumen'], ['cursos', 'Cursos disponibles'], ['matriculas', 'Mis matrículas'], ['pagos', 'Mis pagos'], ['notas', 'Mis notas'], ['avisos', 'Notificaciones']],
  docente: [['mis-cursos', 'Mis cursos'], ['avisos', 'Notificaciones']],
  admin: [['oferta', 'Oferta académica'], ['estudiantes', 'Estudiantes'], ['admin-matriculas', 'Matrículas'], ['admin-pagos', 'Pagos'], ['difusion', 'Enviar aviso'], ['estado', 'Estado del sistema']],
};
function boot() {
  const menu = MENUS[user.role];
  $('#app').innerHTML = `<div class="shell"><nav><div class="brand">Plataforma Académica</div><div class="who">${esc(user.name)} · ${esc(user.role)}</div>
   ${menu.map(([id, label]) => `<button class="item" data-v="${id}">${label}</button>`).join('')}<div class="spacer"></div><button class="item" id="out">Cerrar sesión</button></nav><main id="main"></main></div>`;
  document.querySelectorAll('nav [data-v]').forEach((b) => b.onclick = () => show(b.dataset.v));
  $('#out').onclick = logout; show(menu[0][0]);
}
function show(id) {
  current = id;
  document.querySelectorAll('nav [data-v]').forEach((b) => b.dataset.v === id ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('#main').innerHTML = '<p class="sub">Cargando…</p>';
  run(() => VIEWS[id]());
}
const out = (html) => { $('#main').innerHTML = html; };
const refresh = () => show(current);
const act = (sel, fn) => document.querySelectorAll(sel).forEach((b) => b.onclick = () => run(() => fn(b.dataset)));

/* ---------- Pago ---------- */
function payDialog(id, amount, concept) {
  const d = $('#payDlg');
  d.innerHTML = `<h3 style="margin-top:0">Pagar ${cop(amount)}</h3><p class="sub">${esc(concept)}</p>
  <div class="form-row" style="grid-template-columns:1fr"><div><label for="pm">Método</label><select id="pm"><option>TARJETA</option><option>PSE</option></select></div>
  <div id="cardRow"><label for="cn">Número de tarjeta</label><input id="cn" value="4242 4242 4242 4242" inputmode="numeric"><small style="color:var(--muted)">Si termina en 0000 la pasarela simulada la rechaza.</small></div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" id="pc">Cancelar</button><button id="pp">Pagar ahora</button></div>`;
  d.showModal();
  $('#pm').onchange = () => $('#cardRow').style.display = $('#pm').value === 'TARJETA' ? '' : 'none';
  $('#pc').onclick = () => d.close();
  $('#pp').onclick = () => run(async () => {
    try { await api(`/payments/${id}/pay`, { method: 'POST', body: { method: $('#pm').value, card: $('#cn').value } }); d.close(); toast('Pago aprobado. Confirmando tu matrícula…'); setTimeout(refresh, 900); }
    catch (e) { d.close(); toast(e.message, true); setTimeout(refresh, 600); }
  });
}

/* ---------- Vistas ---------- */
const VIEWS = {
  async resumen() {
    const d = await api('/dashboard');
    const pend = d.pendingPayments || [], enr = d.enrollments || [], nts = (d.notifications || []).slice(0, 4);
    out(`<h2>Hola, ${esc(user.name.split(' ')[0])}</h2><p class="sub">${d.student ? esc(d.student.program) + ' · semestre ' + d.student.semester : 'Perfil no disponible'}</p>
    ${d.degraded.length ? `<div class="note">Algunos datos no están disponibles ahora mismo (${esc(d.degraded.join(', '))}). El resto de tu resumen sí se cargó.</div>` : ''}
    <div class="grid"><div class="card stat"><b>${enr.filter((e) => e.status === 'CONFIRMADA').length}</b>matrículas confirmadas</div>
    <div class="card stat"><b>${pend.length}</b>pagos pendientes</div><div class="card stat"><b>${cop(pend.reduce((s, p) => s + p.amount, 0))}</b>por pagar</div></div>
    <h3>Pagos pendientes</h3>${table(['Concepto', '#Valor', 'Vence', ''], pend.map((p) => `<tr><td>${esc(p.concept)}</td><td class="num">${cop(p.amount)}</td><td>${fdate(p.due_at)}</td><td><button data-id="${p.id}" data-a="${p.amount}" data-c="${esc(p.concept)}" class="pay">Pagar</button></td></tr>`), 'No tienes pagos pendientes.')}
    <h3>Últimos avisos</h3>${nts.length ? nts.map((n) => `<div class="notice ${n.read ? '' : 'unread'}"><b>${esc(n.title)}</b><br>${esc(n.message)}<br><small>${fdate(n.created_at)}</small></div>`).join('') : '<div class="empty">Sin avisos por ahora.</div>'}`);
    act('.pay', (x) => payDialog(x.id, Number(x.a), x.c));
  },
  async cursos() {
    const cs = await api('/courses?status=ABIERTO');
    out(`<h2>Cursos disponibles</h2><p class="sub">Al matricularte se reserva tu cupo y se genera el cobro. La matrícula se confirma cuando pagas.</p>
    ${table(['Código', 'Curso', 'Docente', '#Créditos', '#Cupos libres', '#Valor', ''], cs.map((c) => `<tr><td>${esc(c.code)}</td><td>${esc(c.name)}</td><td>${esc(c.teacher_name)}</td><td class="num">${c.credits}</td><td class="num">${c.available}/${c.capacity}</td><td class="num">${cop(c.price)}</td><td><button class="enroll" data-id="${c.id}" ${c.available ? '' : 'disabled'}>${c.available ? 'Matricular' : 'Sin cupos'}</button></td></tr>`), 'No hay cursos abiertos.')}`);
    act('.enroll', async (x) => { await api('/enrollments', { method: 'POST', body: { courseId: Number(x.id) } }); toast('Cupo reservado. Revisa "Mis pagos" para confirmar tu matrícula.'); refresh(); });
  },
  async matriculas() {
    const es = await api('/enrollments/me');
    out(`<h2>Mis matrículas</h2><p class="sub">Puedes cancelar una matrícula mientras su pago esté pendiente.</p>
    ${table(['Curso', 'Periodo', 'Estado', 'Detalle', ''], es.map((e) => `<tr><td>${esc(e.course_name || 'Curso #' + e.course_id)}</td><td>${esc(e.period || '—')}</td><td>${pill(e.status)}</td><td>${esc(e.reason || '')}</td><td>${e.status === 'PENDIENTE_PAGO' ? `<button class="danger cx" data-id="${e.id}">Cancelar</button>` : ''}</td></tr>`), 'Aún no tienes matrículas. Empieza en "Cursos disponibles".')}`);
    act('.cx', async (x) => { await api(`/enrollments/${x.id}/cancel`, { method: 'POST' }); toast('Matrícula cancelada y cupo liberado.'); setTimeout(refresh, 600); });
  },
  async pagos() {
    const ps = await api('/payments/me');
    out(`<h2>Mis pagos</h2><p class="sub">Si no pagas antes del vencimiento, la matrícula se cancela y el cupo se libera.</p>
    ${table(['Concepto', '#Valor', 'Estado', 'Vence', 'Pagado', ''], ps.map((p) => `<tr><td>${esc(p.concept)}</td><td class="num">${cop(p.amount)}</td><td>${pill(p.status)}</td><td>${fdate(p.due_at)}</td><td>${fdate(p.paid_at)}</td><td>${p.status === 'PENDIENTE' ? `<button class="pay" data-id="${p.id}" data-a="${p.amount}" data-c="${esc(p.concept)}">Pagar</button>` : ''}</td></tr>`), 'No tienes pagos registrados.')}`);
    act('.pay', (x) => payDialog(x.id, Number(x.a), x.c));
  },
  async notas() {
    const gs = await api('/grades/me');
    out(`<h2>Mis notas</h2><p class="sub">Calificaciones registradas por tus docentes.</p>${table(['Curso', '#Nota', 'Comentario', 'Actualizada'], gs.map((g) => `<tr><td>${esc(g.course_name)}</td><td class="num"><b>${g.value.toFixed(1)}</b></td><td>${esc(g.comment)}</td><td>${fdate(g.updated_at)}</td></tr>`), 'Todavía no tienes notas registradas.')}`);
  },
  async avisos() {
    const ns = await api('/notifications/me');
    out(`<h2>Notificaciones</h2><p class="sub"><button class="ghost" id="ra">Marcar todas como leídas</button></p>${ns.length ? ns.map((n) => `<div class="notice ${n.read ? '' : 'unread'}"><b>${esc(n.title)}</b><br>${esc(n.message)}<br><small>${fdate(n.created_at)}</small></div>`).join('') : '<div class="empty">No tienes notificaciones.</div>'}`);
    $('#ra').onclick = () => run(async () => { await api('/notifications/read-all', { method: 'POST' }); refresh(); });
  },
  async 'mis-cursos'() {
    const cs = await api('/teachers/me/courses');
    out(`<h2>Mis cursos</h2><p class="sub">Selecciona un curso para ver a sus estudiantes y registrar notas.</p>
    ${table(['Código', 'Curso', '#Cupos ocupados', ''], cs.map((c) => `<tr><td>${esc(c.code)}</td><td>${esc(c.name)}</td><td class="num">${c.enrolled}/${c.capacity}</td><td><button class="ghost open" data-id="${c.id}">Ver estudiantes</button></td></tr>`), 'No tienes cursos asignados.')}<div id="roster"></div>`);
    act('.open', async (x) => {
      const d = await api(`/teachers/me/courses/${x.id}/students`);
      $('#roster').innerHTML = `<h3>${esc(d.course.name)}: estudiantes matriculados</h3>` + table(['Estudiante', 'Correo', '#Nota (0–5)', 'Comentario', ''], d.students.map((s) => `<tr><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td><input class="gv" data-e="${s.enrollmentId}" type="number" min="0" max="5" step="0.1" value="${s.grade ?? ''}" style="width:90px"></td><td><input class="gc" data-e="${s.enrollmentId}" value="${esc(s.comment || '')}"></td><td><button class="sg" data-e="${s.enrollmentId}" data-c="${x.id}">Guardar nota</button></td></tr>`), 'Aún no hay estudiantes con matrícula confirmada en este curso.');
      act('.sg', async (y) => {
        const value = document.querySelector(`.gv[data-e="${y.e}"]`).value, comment = document.querySelector(`.gc[data-e="${y.e}"]`).value;
        await api('/grades', { method: 'POST', body: { enrollmentId: Number(y.e), value, comment } }); toast('Nota guardada y estudiante notificado.');
      });
    });
  },
  async oferta() {
    const [cs, ts] = await Promise.all([api('/courses'), api('/teachers')]);
    out(`<h2>Oferta académica</h2><p class="sub">Los cursos nuevos se anuncian automáticamente a los estudiantes.</p>
    ${table(['Código', 'Curso', 'Docente', '#Cupos', '#Valor', 'Estado', ''], cs.map((c) => `<tr><td>${esc(c.code)}</td><td>${esc(c.name)}</td><td>${esc(c.teacher_name)}</td><td class="num">${c.enrolled}/${c.capacity}</td><td class="num">${cop(c.price)}</td><td>${pill(c.status)}</td><td><button class="ghost tg" data-id="${c.id}" data-s="${c.status === 'ABIERTO' ? 'CERRADO' : 'ABIERTO'}">${c.status === 'ABIERTO' ? 'Cerrar' : 'Abrir'}</button></td></tr>`), 'No hay cursos.')}
    <h3>Crear curso</h3><div class="card"><div class="form-row"><div><label for="nc">Código</label><input id="nc"></div><div><label for="nn">Nombre</label><input id="nn"></div><div><label for="ncr">Créditos</label><input id="ncr" type="number" value="3"></div>
    <div><label for="nt">Docente</label><select id="nt">${ts.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div><label for="ncp">Cupo</label><input id="ncp" type="number" value="30"></div><div><label for="np">Valor (COP)</label><input id="np" type="number" value="1000000"></div><div><label for="npe">Periodo</label><input id="npe" value="2026-2"></div></div><button id="mk">Crear curso</button></div>`);
    act('.tg', async (x) => { await api(`/courses/${x.id}`, { method: 'PUT', body: { status: x.s } }); refresh(); });
    $('#mk').onclick = () => run(async () => { await api('/courses', { method: 'POST', body: { code: $('#nc').value, name: $('#nn').value, credits: $('#ncr').value, teacherId: $('#nt').value, capacity: $('#ncp').value, price: $('#np').value, period: $('#npe').value } }); toast('Curso creado.'); refresh(); });
  },
  async estudiantes() {
    const ss = await api('/students');
    out(`<h2>Estudiantes</h2><p class="sub">Al crear un estudiante se le genera un usuario; su contraseña inicial es su documento.</p>
    ${table(['Documento', 'Nombre', 'Correo', 'Programa', '#Sem.', 'Estado'], ss.map((s) => `<tr><td>${esc(s.document)}</td><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(s.program)}</td><td class="num">${s.semester}</td><td>${pill(s.status)}</td></tr>`), 'No hay estudiantes.')}
    <h3>Registrar estudiante</h3><div class="card"><div class="form-row"><div><label for="sd">Documento</label><input id="sd"></div><div><label for="sn">Nombre</label><input id="sn"></div><div><label for="se">Correo</label><input id="se" type="email"></div><div><label for="sp">Programa</label><input id="sp"></div></div><button id="ms">Registrar</button></div>`);
    $('#ms').onclick = () => run(async () => { await api('/students', { method: 'POST', body: { document: $('#sd').value, name: $('#sn').value, email: $('#se').value, program: $('#sp').value } }); toast('Estudiante registrado y usuario creado.'); refresh(); });
  },
  async 'admin-matriculas'() {
    const es = await api('/enrollments');
    out(`<h2>Matrículas</h2><p class="sub">Supervisión de todos los procesos de matrícula.</p>${table(['#', 'Estudiante', 'Curso', '#Valor', 'Estado', 'Detalle', 'Actualizada'], es.map((e) => `<tr><td>${e.id}</td><td>${esc(e.student_name)}</td><td>${esc(e.course_name || '—')}</td><td class="num">${e.amount ? cop(e.amount) : '—'}</td><td>${pill(e.status)}</td><td>${esc(e.reason || '')}</td><td>${fdate(e.updated_at)}</td></tr>`), 'No hay matrículas.')}`);
  },
  async 'admin-pagos'() {
    const [sm, ps] = await Promise.all([api('/payments/summary'), api('/payments')]);
    out(`<h2>Pagos</h2><p class="sub">Control de recaudo académico.</p><div class="grid">${sm.map((s) => `<div class="card stat"><b>${cop(s.total)}</b>${pill(s.status)} · ${s.count} pago(s)</div>`).join('') || '<div class="empty">Sin pagos todavía.</div>'}</div>
    <h3>Detalle</h3>${table(['#', 'Estudiante', 'Concepto', '#Valor', 'Estado', 'Intentos', 'Pagado'], ps.map((p) => `<tr><td>${p.id}</td><td>#${p.student_id}</td><td>${esc(p.concept)}</td><td class="num">${cop(p.amount)}</td><td>${pill(p.status)}</td><td class="num">${p.attempts}</td><td>${fdate(p.paid_at)}</td></tr>`), 'No hay pagos.')}`);
  },
  async difusion() {
    out(`<h2>Enviar aviso</h2><p class="sub">El aviso llega a la bandeja de notificaciones del grupo elegido.</p><div class="card" style="max-width:560px"><div class="form-row" style="grid-template-columns:1fr"><div><label for="bd">Destinatarios</label><select id="bd"><option value="todos">Estudiantes y docentes</option><option value="estudiante">Solo estudiantes</option><option value="docente">Solo docentes</option></select></div><div><label for="bt">Título</label><input id="bt"></div><div><label for="bm">Mensaje</label><input id="bm"></div></div><button id="bs">Enviar aviso</button></div>`);
    $('#bs').onclick = () => run(async () => { await api('/notifications/broadcast', { method: 'POST', body: { role: $('#bd').value, title: $('#bt').value, message: $('#bm').value } }); toast('Aviso enviado.'); $('#bt').value = $('#bm').value = ''; });
  },
  async estado() {
    const hs = await api('/health');
    out(`<h2>Estado del sistema</h2><p class="sub">Cada microservicio responde a su propio /health.</p><div class="grid">${hs.map((s) => `<div class="card"><b>${esc(s.service)}</b><br>${pill(s.status)}</div>`).join('')}</div><p><button class="ghost" id="rf">Actualizar</button></p>`);
    $('#rf').onclick = refresh;
  },
};
token && user ? boot() : renderLogin();
</script>
</body>
</html>
